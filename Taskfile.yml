version: "3"

vars:
  WSL_REPO: ~/tickets
  # Build identity (internal/buildinfo), shared by build and release
  # (Phase 6 Step 10). VERSION falls back to "dev" with no tags yet in
  # this repo (`--always` still yields a short commit hash, and the
  # `|| echo dev` only fires if git itself is unavailable); COMMIT
  # falls back to "none" the same way. Computed with `sh:` rather than
  # Task's `now`/git template funcs so the same expression works
  # identically in `task build` (Windows or WSL) and a future CI job.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE: '{{now.UTC.Format "2006-01-02T15:04:05Z"}}'
  LDFLAGS: >-
    -X github.com/ArloB/tickets/internal/buildinfo.Version={{.VERSION}}
    -X github.com/ArloB/tickets/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/ArloB/tickets/internal/buildinfo.Date={{.DATE}}

tasks:
  fmt:
    desc: Format Go source (gofmt -l fails the task if anything is unformatted).
    cmds:
      - gofmt -l -s .
      - go vet ./...

  lint:
    desc: Run golangci-lint against the whole module.
    cmds:
      - golangci-lint run ./...

  openapi:
    desc: Lint the checked-in OpenAPI contract.
    cmds:
      - npx --yes @redocly/cli lint api/openapi.yaml

  test:
    desc: >
      Run the Go test suite. Windows has no C toolchain, so plain `go test`
      runs here; the race detector runs only on the Linux leg (task test:race).
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector. Requires a C toolchain (WSL has gcc; Windows does not).
    cmds:
      - go test -race ./...

  build:
    desc: >
      Build the tickets binary for the host platform, with the real web
      UI embedded — depends on web:build so `task build`/`task ci`
      never ship the empty-dist placeholder by accident. A bare
      `go build ./cmd/tickets` (no Task, no Node) still works on
      whatever's already in web/dist/ — see ADR 0010 — but reports
      internal/buildinfo's "dev"/"none"/"unknown" defaults instead of
      this task's real version/commit/date, since ldflags only get set
      here.
    vars:
      OUT: '{{if eq OS "windows"}}bin/tickets.exe{{else}}bin/tickets{{end}}'
    deps: [web:build]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.OUT}} ./cmd/tickets

  web:install:
    desc: Install the web UI's npm dependencies.
    dir: web
    run: once
    cmds:
      - npm install

  web:lint:
    desc: Lint the web UI with oxlint.
    dir: web
    deps: [web:install]
    cmds:
      - npm run lint

  web:test:
    desc: Run the web UI's Vitest unit/component tests.
    dir: web
    deps: [web:install]
    cmds:
      - npm run test -- --run

  web:build:
    desc: >
      Type-check and produce the web UI's production build (web/dist),
      the asset internal/httpapi embeds and serves.
    dir: web
    deps: [web:install]
    cmds:
      - npm run build

  web:e2e:
    desc: >
      Run the Playwright e2e suite against a real compiled `tickets`
      binary and a fresh throwaway SQLite data dir (web/e2e/run-server.mjs
      launches and tears it down automatically). Not part of `task ci`
      (like `task bench`) — needs the binary built first and is slower
      than the rest of the gate.
    dir: web
    deps: [web:install, build]
    cmds:
      - npx playwright test

  web:dev:
    desc: >
      Run the Vite dev server against a separately running `tickets
      server` (default http://127.0.0.1:8080; override with
      TICKETS_DEV_API_URL). /api/v1 and /healthz are proxied so the
      session cookie stays same-origin (vite.config.ts).
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  ci:
    desc: Full local CI gate for the host platform (Windows leg).
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: openapi
      - task: web:lint
      - task: web:test
      - task: build

  ci:linux:
    desc: >
      Run the CI gate inside the WSL clone at {{.WSL_REPO}}, including the
      race detector. Pulls first so it never tests stale code.
    cmds:
      - wsl -e bash -lc "cd {{.WSL_REPO}} && git pull --ff-only && task fmt lint test:race openapi web:lint web:test build"

  release:
    desc: >
      Cross-compile release archives for linux/amd64, linux/arm64, and
      windows/amd64 (tools/release), embedding the same
      version/commit/date ldflags `task build` uses and a real web UI
      (depends on web:build). Pure Go, no CGO anywhere in this module
      (ADR 0003), so cross-compiling a Windows/arm64 binary from any
      host needs nothing beyond the Go toolchain already required for
      `task build` — no per-platform CI runner, no extra toolchain
      install. Output: one .tar.gz (linux) or .zip (windows) per
      target plus a SHA256SUMS manifest, all in dist/ (gitignored).
      VERSION comes from `git describe --tags --dirty`: a real tagged
      release is only ever built from a clean checkout at that tag
      (release.yml's CI run always is), but a local run against
      uncommitted changes produces a "-dirty"-suffixed archive instead
      of silently mislabeling it as the tagged version.
    deps: [web:build]
    cmds:
      - go run ./tools/release -version "{{.VERSION}}" -commit "{{.COMMIT}}" -date "{{.DATE}}" -out dist

  docker:build:
    desc: >
      Build the Docker image (tickets:local), embedding the same
      version/commit/date ldflags as `task build`/`task release` via
      --build-arg. Needs a reachable Docker daemon — on Windows that
      means WSL or Docker Desktop with WSL integration, since Docker
      itself isn't installed on the Windows host in this repo's setup
      (see docs/deploy-docker.md).
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} --build-arg DATE={{.DATE}} -t tickets:local .

  docker:up:
    desc: >
      Pull (docker-compose.yml's image: ghcr.io/arlob/tickets:latest)
      and start the Docker Compose service in the background, then
      open http://127.0.0.1:8080 — the web UI walks through first-run
      setup from there. See docs/deploy-docker.md.
    cmds:
      - docker compose up -d

  bench:
    desc: >
      Run product spec §11's performance benchmarks against the full
      reference dataset — 25 projects, 100,000 tickets, 500,000
      comments, 10,000 decisions/plans/documents, generated once per
      package via internal/fixtures.Full (a few seconds to build, per
      package). Deliberately not part of `task ci`: this takes minutes,
      not seconds, and Benchmark functions are never run by a plain
      `go test`, so leaving it out costs nothing there. Records ns/op
      and allocs (-benchmem); go test's own output header records
      goos/goarch/cpu for you. Three benchmarks (one per §11 target
      category) also report p95-ms/op and cold-ms/op custom metrics
      via benchP95 (internal/store/bench_test.go) — see
      docs/benchmarks.md's "Warm/cold state" section for exactly what
      "cold" does and doesn't mean here (product spec §11: "benchmarks
      must record dataset, hardware, build, and cold/warm state").
    cmds:
      - go version
      - go test -run '^$' -bench=. -benchmem -timeout=30m ./internal/store/... ./internal/service/... ./internal/httpapi/...

  acceptance:row10:
    desc: >
      Run docs/mvp-acceptance.md row 10's live-agent drill: real Claude
      Code and Codex sessions, headless, against a throwaway Tickets
      server over MCP, performing §16 criterion 10's representative
      workflow. Deliberately NOT part of `task ci`: it drives real LLM
      hosts, so it needs the caller's own `claude`/`codex` credentials,
      costs tokens, takes minutes, and is stochastic — a single run is
      evidence, not a gate. Pass RUNS=5 to get a pass rate worth
      quoting, and HOSTS=claude to drill one host. Every transcript,
      server log, and a summary.json land in artifacts/row10/. See
      docs/row10-live-agent-drill.md for the methodology, the assertion
      tiers, and the host flags that matter.
    deps: [build]
    vars:
      RUNS: '{{.RUNS | default "1"}}'
      HOSTS: '{{.HOSTS | default "claude,codex"}}'
      BIN: '{{if eq OS "windows"}}bin/tickets.exe{{else}}bin/tickets{{end}}'
    cmds:
      - go run ./tools/row10drill -bin {{.BIN}} -n {{.RUNS}} -hosts {{.HOSTS}}
