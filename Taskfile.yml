version: "3"

vars:
  WSL_REPO: ~/tickets

tasks:
  fmt:
    desc: Format Go source (gofmt -l fails the task if anything is unformatted).
    cmds:
      - gofmt -l -s .
      - go vet ./...

  lint:
    desc: Run golangci-lint against the whole module.
    cmds:
      - golangci-lint run ./...

  openapi:
    desc: Lint the checked-in OpenAPI contract.
    cmds:
      - npx --yes @redocly/cli lint api/openapi.yaml

  test:
    desc: >
      Run the Go test suite. Windows has no C toolchain, so plain `go test`
      runs here; the race detector runs only on the Linux leg (task test:race).
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector. Requires a C toolchain (WSL has gcc; Windows does not).
    cmds:
      - go test -race ./...

  build:
    desc: >
      Build the tickets binary for the host platform, with the real web
      UI embedded — depends on web:build so `task build`/`task ci`
      never ship the empty-dist placeholder by accident. A bare
      `go build ./cmd/tickets` (no Task, no Node) still works on
      whatever's already in web/dist/ — see ADR 0010.
    vars:
      OUT: '{{if eq OS "windows"}}bin/tickets.exe{{else}}bin/tickets{{end}}'
    deps: [web:build]
    cmds:
      - go build -o {{.OUT}} ./cmd/tickets

  web:install:
    desc: Install the web UI's npm dependencies.
    dir: web
    run: once
    cmds:
      - npm install

  web:lint:
    desc: Lint the web UI with oxlint.
    dir: web
    deps: [web:install]
    cmds:
      - npm run lint

  web:test:
    desc: Run the web UI's Vitest unit/component tests.
    dir: web
    deps: [web:install]
    cmds:
      - npm run test -- --run

  web:build:
    desc: >
      Type-check and produce the web UI's production build (web/dist),
      the asset internal/httpapi embeds and serves.
    dir: web
    deps: [web:install]
    cmds:
      - npm run build

  web:dev:
    desc: >
      Run the Vite dev server against a separately running `tickets
      server` (default http://127.0.0.1:8080; override with
      TICKETS_DEV_API_URL). /api/v1 and /healthz are proxied so the
      session cookie stays same-origin (vite.config.ts).
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  ci:
    desc: Full local CI gate for the host platform (Windows leg).
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: openapi
      - task: web:lint
      - task: web:test
      - task: build

  ci:linux:
    desc: >
      Run the CI gate inside the WSL clone at {{.WSL_REPO}}, including the
      race detector. Pulls first so it never tests stale code.
    cmds:
      - wsl -e bash -lc "cd {{.WSL_REPO}} && git pull --ff-only && task fmt lint test:race openapi web:lint web:test build"

  bench:
    desc: >
      Run Phase 1's performance benchmarks (product spec §11) against
      the full reference dataset — 25 projects, 100,000 tickets,
      500,000 comments, generated once per package via
      internal/fixtures.Full (~20s to build, per package). Deliberately
      not part of `task ci`: this takes minutes, not seconds, and
      Benchmark functions are never run by a plain `go test`, so
      leaving it out costs nothing there. Records ns/op and allocs
      (-benchmem); go test's own output header records goos/goarch/cpu
      for you. "Cold vs warm" isn't independently controlled here —
      each package's fixture is generated fresh at the start of that
      package's run, and SQLite's own page cache warms up across a
      benchmark's b.N iterations within it; report numbers as "first
      run this process" rather than claiming precision this setup
      doesn't have (product spec §11: "benchmarks must record dataset,
      hardware, build, and cold/warm state").
    cmds:
      - go version
      - go test -run '^$' -bench=. -benchmem -timeout=30m ./internal/store/... ./internal/service/...
