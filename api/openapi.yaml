        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            OK. Sets the tickets_session cookie; the response body's
            csrf_token must be echoed back as X-CSRF-Token on every
            subsequent mutating request made with this session.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: End the caller's session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /auth/me:
    get:
      operationId: getMe
      summary: Report the caller's own resolved permission level and identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /accounts:
    post:
      operationId: createAccount
      summary: >
        Create a second (or later) human account (admin only, Phase 7
        — product spec §4.2/§13). The first human account is created
        by POST /setup instead; this is for every one after that.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: listAccounts
      summary: List every human account (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsPage'
        '403':
          $ref: '#/components/responses/Error'

  /accounts/{username}/password:
    post:
      operationId: changePassword
      summary: >
        Change a human account's password. A human may change their
        own password (old_password required and verified); an admin
        may reset any account's password without knowing the current
        one (old_password ignored). Every existing session for that
        account is invalidated on success.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /agents:
    post:
      operationId: createAgent
      summary: Create a new agent actor, owned by the calling human (admin only)
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: listAgents
      summary: List every agent actor (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsPage'
        '403':
          $ref: '#/components/responses/Error'

  /agents/{name}/tokens:
    post:
      operationId: createAgentToken
      summary: >
        Issue a fresh bearer token for an agent (admin only). The raw
        token value is returned exactly once, in this response only —
        see AgentTokenCreated.
      parameters:
        - $ref: '#/components/parameters/AgentName'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTokenRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenCreated'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listAgentTokens
      summary: List an agent's tokens, including revoked/expired ones (admin only)
      parameters:
        - $ref: '#/components/parameters/AgentName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokensPage'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /agents/{name}/tokens/{id}:
    delete:
      operationId: revokeAgentToken
      summary: Permanently revoke an agent token (admin only; there is no un-revoke)
      parameters:
        - $ref: '#/components/parameters/AgentName'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '403':
          $ref: '#/components/responses/Error'

  /admin/backup:
    get:
      operationId: downloadBackup
      summary: >
        Download a full disaster-recovery snapshot as a zip archive
        (admin only) — the same manifest-verified database-plus-blobs
        snapshot `tickets admin backup` produces, packaged for a single
        HTTP download instead of a directory on the server's own disk.
      responses:
        '200':
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Error'

  /admin/restore:
    get:
      operationId: getRestoreStatus
      summary: Report whether a restore is staged to apply on next restart, or whether the last staged restore failed to apply (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePendingStatus'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: uploadRestore
      summary: >
        Upload a backup archive to stage for restore. Validated
        (manifest checksums) immediately, but only applied the next
        time the server starts — a running server cannot safely
        replace its own open database file.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStagedResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      operationId: dismissFailedRestore
      summary: Clear a failed-restore notice (admin only) — does not affect a currently-staged restore, only the record of a past failure
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Error'

  /admin/export:
    get:
      operationId: downloadExport
      summary: >
        Download a portable, redacted export of every non-secret
        domain table (admin only) — the same envelope `tickets export`
        produces. Plain JSON by default; pass attachments=true to
        receive a zip containing envelope.json plus every referenced
        attachment blob instead.
      parameters:
        - name: attachments
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Error'

  /admin/integrity:
    get:
      operationId: getIntegrityReport
      summary: Run PRAGMA integrity_check/foreign_key_check plus a blob-store verify/orphan sweep, without removing anything (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityReport'
        '403':
          $ref: '#/components/responses/Error'

  /admin/integrity/gc:
    post:
      operationId: runIntegrityGC
      summary: >
        Re-run the integrity check and permanently delete every
        orphaned blob it finds older than an hour (admin only).
        Requires confirm: true in the body — a deliberate, separate
        step from the read-only report.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GCRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityReport'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /setup/import:
    post:
      operationId: setupImport
      summary: >
        Import a portable export as part of first-run setup.
        Unauthenticated, like /setup — self-limited the same way
        service.Import already is: it refuses to commit unless the
        target database is still completely empty, which stops being
        true the moment any project or the first admin account exists.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope:
                  type: string
                  format: binary
                attachments:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          $ref: '#/components/responses/Error'

components:
  parameters:
    ProjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9]{1,9}$'
    TicketRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-123
    FeatureRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-F1
    DecisionRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-D1
    PlanRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-P1
    DocumentRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-DOC1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        A double-quoted decimal version number, e.g. "3" (see
        docs/contracts/concurrency.md — not full RFC 7232 ETag
        semantics).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >
        Required when authenticated via the tickets_session cookie
        (product spec §10); not required for bearer-token requests,
        which aren't subject to browser CSRF. Documented as optional
        here because whether it's actually required depends on which
        credential the request uses, which OpenAPI 3.0 can't express
        conditionally.
      schema:
        type: string
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
    FilterStatus:
      name: status
      in: query
      description: >
        Narrow to one workflow status (docs/contracts/list-filters.md).
        AND-composed with every other filter present; absent = any.
      schema:
        type: string
        enum: [backlog, ready, in_progress, blocked, review, done, cancelled]
    FilterPriority:
      name: priority
      in: query
      description: Narrow to one priority. AND-composed; absent = any.
      schema:
        type: string
        enum: [critical, high, medium, low]
    FilterCreator:
      name: creator
      in: query
      description: >
        Narrow to one creator, as an actor reference wire form (e.g.
        "human:alice"). AND-composed; absent = any.
      schema:
        type: string
    FilterUpdatedSince:
      name: updated_since
      in: query
      description: >
        Narrow to records updated at or after this RFC3339 timestamp.
        AND-composed; absent = any.
      schema:
        type: string
        format: date-time
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AttachmentVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
    RelationshipType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RelationshipType'
    TargetRef:
      name: target
      in: path
      required: true
      description: A ticket or feature reference (e.g. ABC-123 or ABC-F1).
      schema:
        type: string
    LinkID:
      name: id
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tickets_session
      description: >
        Human session cookie, set by POST /auth/login (ADR 0004).
        Mutating requests using it must also carry X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Agent bearer token, issued once by POST
        /agents/{name}/tokens and never shown again (ADR 0004).

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ProjectStatus:
      type: string
      enum: [active, archived]
    TicketType:
      type: string
      enum: [task, bug, security, chore]
    WorkflowStatus:
      type: string
      enum: [backlog, ready, in_progress, blocked, review, done, cancelled]
    Priority:
      type: string
      enum: [critical, high, medium, low]
    Severity:
      type: string
      enum: [critical, high, medium, low]
    DecisionStatus:
      type: string
      enum: [proposed, accepted, rejected, superseded]

    CreateProjectRequest:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        title:
          type: string
        description:
          type: string

    UpdateProjectRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }

    UpdateProjectStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProjectStatus' }

    Project:
      type: object
      required: [key, title, description, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        creator:
          type: string
          example: 'human:alice'
          description: >
            Absent only for entities created before Phase 2's identity
            work (ADR 0012); always present for anything created since.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCompact:
      type: object
      required: [key, title, status, version, updated_at]
      additionalProperties: false
      description: >
        The list-item shape GET /projects returns (docs/contracts/
        representations.md's compact/detail split). No description, no
        created_at — small enough that a full page stays well under
        agent context budgets (product spec §7.2).
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ProjectsPage:
      type: object
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectCompact' }
        next_cursor:
          type: string

    ProjectBrief:
      type: object
      required: [project, in_progress, issue_register, features, recent_activity, recent_decisions, recent_plans]
      additionalProperties: false
      description: >
        GET /projects/{key}/brief's response — every section capped at
        20 compact rows (product spec §11).
      properties:
        project: { $ref: '#/components/schemas/Project' }
        in_progress:
          type: array
          items: { $ref: '#/components/schemas/TicketCompact' }
          description: Priority-queue order, excluding done/cancelled tickets.
        issue_register:
          type: array
          items: { $ref: '#/components/schemas/TicketCompact' }
          description: Severity-queue order, excluding done/cancelled tickets.
        features:
          type: array
          items: { $ref: '#/components/schemas/FeatureBriefRow' }
        recent_activity:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        recent_decisions:
          type: array
          items: { $ref: '#/components/schemas/DecisionCompact' }
          description: Accepted decisions only, newest first.
        recent_plans:
          type: array
          items: { $ref: '#/components/schemas/ContentItemCompact' }
          description: Newest first.

    FeatureBriefRow:
      type: object
      required: [ref, title, status, priority, version, updated_at, tickets_total, tickets_done]
      additionalProperties: false
      description: FeatureCompact plus a ticket-progress summary for the project brief.
      properties:
        ref: { type: string, example: ABC-F1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        tickets_total: { type: integer }
        tickets_done: { type: integer }

    CreateTicketRequest:
      type: object
      required: [type, title]
      description: >
        Exactly one of feature or general is required (not enforced by
        this schema's required list since it's an XOR, not a plain
        required field) — the server rejects a request with neither or
        both set.
      properties:
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }
        feature:
          type: string
          example: ABC-F2
          description: The destination feature reference. Mutually exclusive with general.
        general:
          type: boolean
          description: Explicitly create the ticket in the project's General feature. Mutually exclusive with feature.

    UpdateTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkflowStatus' }

    UpdateTicketFieldsRequest:
      type: object
      required: [type, title, priority]
      properties:
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }

    AssignTicketRequest:
      type: object
      properties:
        assignee:
          type: string
          nullable: true
          example: 'human:alice'
          description: Null clears the assignment.

    MoveTicketRequest:
      type: object
      required: [feature]
      properties:
        feature:
          type: string
          example: ABC-F2

    Ticket:
      type: object
      required: [ref, project, feature, type, title, description, status, priority, version, created_at, updated_at]
      additionalProperties: false
      properties:
        ref: { type: string, example: ABC-123 }
        project: { type: string }
        feature: { type: string, example: ABC-F1 }
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }
        assignee:
          type: string
          example: 'human:alice'
          description: Absent when unassigned.
        creator:
          type: string
          example: 'human:alice'
          description: >
            Absent only for entities created before Phase 2's identity
            work (ADR 0012); always present for anything created since.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
          description: Present only when requested via ?include=comments.
        relationships:
          type: array
          items: { $ref: '#/components/schemas/RelationshipView' }
          description: Present only when requested via ?include=relationships.

    TicketCompact:
      type: object
      required: [ref, title, type, status, priority, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/tickets' list-item shape
        (docs/contracts/representations.md) — no description or body,
        same compact/detail split as FeatureCompact/ProjectCompact.
      properties:
        ref: { type: string, example: ABC-123 }
        title: { type: string }
        type: { $ref: '#/components/schemas/TicketType' }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    TicketsPage:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: '#/components/schemas/TicketCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    CreateFeatureRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }

    UpdateFeatureRequest:
      type: object
      required: [title, priority]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }

    Feature:
      type: object
      required: [ref, project, title, description, status, priority, version, created_at, updated_at]
      additionalProperties: false
      properties:
        ref: { type: string, example: ABC-F1 }
        project: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        creator:
          type: string
          example: 'human:alice'
          description: >
            Absent only for entities created before Phase 2's identity
            work (ADR 0012); always present for anything created since.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }

    FeatureCompact:
      type: object
      required: [ref, title, status, priority, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/features' list-item shape. No description —
        same compact/detail split as ProjectCompact.
      properties:
        ref: { type: string, example: ABC-F1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    FeaturesPage:
      type: object
      properties:
        features:
          type: array
          items: { $ref: '#/components/schemas/FeatureCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    CreateDecisionRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        consequences: { type: string }

    UpdateDecisionRequest:
      type: object
      required: [title, status]
      description: >
        Full-representation update, like PATCH /features/{ref}.
        superseded_by is a decision reference or "" to clear an existing
        link — omitting it clears it too, the same full-representation
        contract every other field here has.
      properties:
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        consequences: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        superseded_by: { type: string, example: ABC-D9 }

    Decision:
      type: object
      required: [ref, project, title, context, decision, rationale, consequences, status, version, created_at, updated_at]
      additionalProperties: false
      description: >
        Product spec §5.8. superseded_by is set on the *old* decision,
        pointing at the *new* one that replaces it; absent until an
        update links it.
      properties:
        ref: { type: string, example: ABC-D1 }
        project: { type: string }
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        consequences: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        superseded_by: { type: string, example: ABC-D9 }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DecisionCompact:
      type: object
      required: [ref, title, status, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/decisions' list-item shape. No context/
        decision/rationale — same compact/detail split as FeatureCompact.
      properties:
        ref: { type: string, example: ABC-D1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    DecisionsPage:
      type: object
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/DecisionCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    DecisionVersion:
      type: object
      required: [version, title, context, decision, rationale, consequences, status, edited_by, created_at]
      additionalProperties: false
      description: One archived prior state of a decision (product spec §5.8).
      properties:
        version: { type: integer }
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        consequences: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        edited_by: { type: string, example: 'human:alice' }
        created_at: { type: string, format: date-time }

    DecisionVersionsPage:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/DecisionVersion' }

    DiffLine:
      type: object
      required: [op, text]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [equal, add, remove]
        text: { type: string }

    DecisionDiff:
      type: object
      required: [from_version, to_version, title, context, decision, rationale, consequences, status_from, status_to]
      additionalProperties: false
      description: >
        A per-field line-level diff between two named versions (product
        spec §5.9). Either version number may name the live version or
        any archived one.
      properties:
        from_version: { type: integer }
        to_version: { type: integer }
        title:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        context:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        decision:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        rationale:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        consequences:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        status_from: { $ref: '#/components/schemas/DecisionStatus' }
        status_to: { $ref: '#/components/schemas/DecisionStatus' }

    CreateContentItemRequest:
      type: object
      required: [title]
      description: >
        JSON body for markdown/path/url representations — a file
        representation is created via multipart/form-data instead (see
        the create operation's other requestBody content entry).
        representation defaults to "markdown" when omitted.
      properties:
        title: { type: string }
        representation:
          type: string
          enum: [markdown, path, url]
        body: { type: string, description: "Markdown body, when representation is markdown" }
        path: { type: string, description: "A path string only, never resolved or read by the server (ADR 0007) — when representation is path" }
        url: { type: string, description: "When representation is url" }

    UpdateContentItemRequest:
      type: object
      required: [title]
      description: >
        Full-representation update, like PATCH /decisions/{ref}. No
        representation field — it's immutable after creation and
        inferred server-side from the existing item; only the field
        relevant to that representation is used.
      properties:
        title: { type: string }
        body: { type: string }
        path: { type: string }
        url: { type: string }

    ContentItemStatus:
      type: string
      description: >
        A plan or document's visibility lifecycle (ADR 0028), mirroring
        ProjectStatus exactly. Archiving is visibility only — it does
        not affect readability or writability, only whether the item
        appears in the default GET /projects/{key}/plans|documents list
        and project_brief's recent_plans section.
      enum: [active, archived]

    UpdateContentItemStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ContentItemStatus' }

    ContentItem:
      type: object
      required: [ref, project, kind, title, representation, status, version, created_at, updated_at]
      additionalProperties: false
      description: >
        A plan or document (product spec §5.9). kind distinguishes the
        two. body/file_*/checksum/path_value/url_value are mutually
        exclusive, populated according to representation.
      properties:
        ref: { type: string, example: ABC-P1 }
        project: { type: string }
        kind:
          type: string
          enum: [plan, document]
        title: { type: string }
        representation:
          type: string
          enum: [markdown, file, path, url]
        body: { type: string }
        file_name: { type: string }
        file_size: { type: integer }
        media_type: { type: string }
        checksum: { type: string }
        path_value: { type: string }
        url_value: { type: string }
        status: { $ref: '#/components/schemas/ContentItemStatus' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContentItemCompact:
      type: object
      required: [ref, title, kind, status, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/plans|documents' list-item shape. No body —
        same compact/detail split as DecisionCompact.
      properties:
        ref: { type: string, example: ABC-P1 }
        title: { type: string }
        kind:
          type: string
          enum: [plan, document]
        status: { $ref: '#/components/schemas/ContentItemStatus' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ContentItemsPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentItemCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    ContentItemVersion:
      type: object
      required: [version, representation, title, edited_by, created_at]
      additionalProperties: false
      description: One archived prior state of a plan or document (product spec §5.9).
      properties:
        version: { type: integer }
        representation:
          type: string
          enum: [markdown, file, path, url]
        title: { type: string }
        body: { type: string }
        file_name: { type: string }
        file_size: { type: integer }
        media_type: { type: string }
        checksum: { type: string }
        path_value: { type: string }
        url_value: { type: string }
        edited_by: { type: string, example: 'human:alice' }
        created_at: { type: string, format: date-time }

    ContentItemVersionsPage:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/ContentItemVersion' }

    ContentItemDiff:
      type: object
      required: [from_version, to_version, title, body]
      additionalProperties: false
      description: >
        A line-level diff of title and body between two named versions
        (product spec §5.9). Either version number may name the live
        version or any archived one.
      properties:
        from_version: { type: integer }
        to_version: { type: integer }
        title:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }
        body:
          type: array
          items: { $ref: '#/components/schemas/DiffLine' }

    ActivityEventType:
      type: string
      description: >
        The "selected" audit event types the activity feed shows
        (product spec §5.10) — internal/service/activity.go's
        activityEventTypes allowlist is this enum's single source of
        truth; keep the two in lockstep.
      enum:
        - project_created
        - ticket_created
        - ticket_status_changed
        - relationship_added
        - relationship_removed
        - feature_created
        - feature_updated
        - feature_status_changed
        - ticket_updated
        - ticket_assigned
        - ticket_moved
        - comment_added
        - comment_edited
        - comment_deleted
        - ticket_reordered
        - feature_reordered
        - ticket_deleted
        - ticket_restored
        - feature_deleted
        - feature_restored
        - association_added
        - association_removed
        - decision_created
        - decision_updated
        - external_link_added
        - external_link_removed
        - content_item_created
        - content_item_updated
        - content_item_archived
        - content_item_unarchived
        - attachment_added
        - attachment_replaced
        - attachment_removed
        - project_updated
        - project_archived
        - project_unarchived

    ActivityEvent:
      type: object
      required: [id, entity_kind, actor, event_type, created_at]
      additionalProperties: false
      description: >
        One row of a project's activity feed (§5.10): comments merged
        with selected audit events, newest first. `entity` is absent
        only for a project-level event (project_created/
        project_updated) — a project has no seq-numbered reference
        token (see the Decision schema's sibling reasoning).
      properties:
        id: { type: integer }
        entity: { type: string, example: ABC-123 }
        entity_kind:
          type: string
          enum: [project, ticket, feature, decision, plan, document]
        actor: { type: string, example: 'human:alice' }
        event_type: { $ref: '#/components/schemas/ActivityEventType' }
        comment_id: { type: integer }
        comment_excerpt:
          type: string
          description: >
            The first 200 characters of the comment's live body, present
            only when comment_id is set.
        created_at: { type: string, format: date-time }

    ActivityPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    ReorderRequest:
      type: object
      properties:
        after_ref:
          type: string
          nullable: true
          description: >
            Place immediately after this reference, which must be in
            the same priority group. Omit or null to move to the head
            of the group.

    AddCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }

    Comment:
      type: object
      required: [id, author, body, version, created_at, updated_at]
      additionalProperties: false
      description: >
        Unlike Ticket/Feature, this schema's id is a bare integer and
        is the comment's actual public identity (ADR 0002's exception
        — a comment has no formatted reference or UUID for a surrogate
        to hide behind; see internal/httpapi/wire_test.go's
        schemasWhereIDIsThePublicIdentity). deleted_at is also exposed
        deliberately here, unlike Ticket/Feature: §5.10's tombstone is
        meant to reach the wire — body stays intact, and a client
        checks deleted_at to render a tombstone instead of the content.
      properties:
        id: { type: integer }
        author: { type: string, example: 'human:alice' }
        body: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }

    CommentsPage:
      type: object
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    CommentHistoryEntry:
      type: object
      required: [version, body, edited_by, created_at]
      additionalProperties: false
      properties:
        version: { type: integer }
        body: { type: string }
        edited_by: { type: string, example: 'human:alice' }
        created_at: { type: string, format: date-time }

    CommentHistoryPage:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/CommentHistoryEntry' }

    RelationshipType:
      type: string
      enum: [parent_of, child_of, blocks, blocked_by, related_to, duplicate_of, supersedes, superseded_by]

    AddRelationshipRequest:
      type: object
      required: [target, type]
      properties:
        target: { type: string, example: ABC-124 }
        type: { $ref: '#/components/schemas/RelationshipType' }

    RelationshipView:
      type: object
      required: [type, other]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/RelationshipType' }
        other: { type: string, example: ABC-124 }

    RelationshipsPage:
      type: object
      properties:
        relationships:
          type: array
          items: { $ref: '#/components/schemas/RelationshipView' }

    AddAssociationRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: A ticket or feature reference (e.g. ABC-123 or ABC-F1).
          example: ABC-F2

    AssociationsPage:
      type: object
      properties:
        associated:
          type: array
          items: { type: string }

    AddLinkRequest:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url:
          type: string
          description: >
            Must use http, https, or mailto — an allow-listed scheme,
            checked server-side (internal/domain.ValidateLinkURL),
            since a stored javascript:/data: URL rendered as a
            clickable link would be a stored-XSS vector.
          example: https://example.com/design-doc

    ExternalLink:
      type: object
      required: [id, title, url]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }

    ExternalLinksPage:
      type: object
      properties:
        links:
          type: array
          items: { $ref: '#/components/schemas/ExternalLink' }

    Backlink:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: >
            The reference of the entity that mentions this record, or
            a bare project key (e.g. "ABC") when the mention came from
            a comment on a project — a project has no seq-numbered
            reference token.
          example: ABC-124
        comment_id:
          type: integer
          description: >
            Present only when the mention came from a comment on ref
            rather than ref's own Markdown body.

    BacklinksPage:
      type: object
      properties:
        backlinks:
          type: array
          items: { $ref: '#/components/schemas/Backlink' }

    Subscription:
      type: object
      required: [subscribed]
      additionalProperties: false
      properties:
        subscribed: { type: boolean }

    Notification:
      type: object
      required: [id, kind, entity, entity_kind, created_at]
      additionalProperties: false
      description: >
        One delivered notification (§6.4): assignment, an @actor
        mention, a reply/comment on subscribed work, or a meaningful
        change to a subscribed ticket/feature/decision. entity always
        names the subject record (the owning ticket for a comment-
        sourced notification, not the comment itself).
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [assigned, mentioned, commented, changed]
        entity: { type: string, example: ABC-123 }
        entity_kind:
          type: string
          enum: [ticket, feature, decision, plan, document]
        comment_id: { type: integer }
        triggered_by: { type: string, example: 'human:alice' }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    NotificationsPage:
      type: object
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor: { type: string }

    MarkNotificationsReadRequest:
      type: object
      additionalProperties: false
      description: >
        Either ids (mark exactly those, already-read ones left alone)
        or all: true (mark every currently-unread notification read).
      properties:
        ids:
          type: array
          items: { type: integer }
        all: { type: boolean }

    MarkNotificationsReadResponse:
      type: object
      required: [marked]
      additionalProperties: false
      properties:
        marked: { type: integer }

    SearchHit:
      type: object
      required: [kind, ref, snippet]
      additionalProperties: false
      description: >
        One ranked row of a search result (§5.12/§6.3). comment_id is
        present only for a comment hit — ref then names the comment's
        owning ticket, the same ref+comment_id shape Backlink uses. An
        attachment or link hit's ref names its owning
        ticket/feature/decision/plan/document instead (never a
        comment_id, even when the attachment is itself attached to a
        comment — see ADR 0018's amendment). title is absent for a
        comment hit (a comment has no title of its own).
      properties:
        kind:
          type: string
          enum: [ticket, feature, decision, plan, document, comment, attachment, link]
        ref:
          type: string
          example: ABC-123
        comment_id: { type: integer }
        title: { type: string }
        snippet:
          type: string
          description: A short excerpt of the matched text, for display.

    SearchPage:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        next_cursor: { type: string }

    ResolvedRefPage:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items: { $ref: '#/components/schemas/ResolvedRef' }

    ResolvedRef:
      type: object
      required: [ref, exists]
      description: >
        One reference token's resolution. kind/title/status are
        present only when exists is true; status is additionally
        absent for plans and documents, which have none.
      properties:
        ref:
          type: string
          description: The token exactly as asked about.
        exists: { type: boolean }
        kind:
          type: string
          enum: [ticket, feature, decision, plan, document, project]
        title: { type: string }
        status: { type: string }

    DeleteResponse:
      type: object
      required: [version]
      additionalProperties: false
      description: >
        The soft-deleted entity's new version (ADR 0013) — enough for
        a caller to construct a subsequent restore call's If-Match
        without a second read.
      properties:
        version: { type: integer }

    AddPathAttachmentRequest:
      type: object
      required: [title, path]
      description: >
        A path-reference attachment (product spec §5.11, ADR 0007) — an
        upload attachment is created via multipart/form-data instead
        (see the same operation's other requestBody content entry).
      properties:
        title: { type: string }
        path:
          type: string
          description: >
            A path string only — never resolved or read by the server
            (ADR 0007's fixed boundary).
        media_type: { type: string }

    ReplacePathAttachmentRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        media_type: { type: string }

    Attachment:
      type: object
      required: [id, kind, title, current_version, created_at, creator]
      additionalProperties: false
      description: >
        Exactly one of owner_ref/comment_id is present, mirroring
        internal/domain.Attachment.
      properties:
        id: { type: integer }
        owner_ref: { type: string, example: ABC-123 }
        comment_id: { type: integer }
        kind: { type: string, enum: [upload, path] }
        title: { type: string }
        current_version: { type: integer }
        file_name: { type: string }
        file_size: { type: integer }
        media_type: { type: string }
        checksum: { type: string }
        path_value: { type: string }
        created_at: { type: string, format: date-time }
        creator: { type: string, example: "human:alice" }
        deleted_at: { type: string, format: date-time }

    AttachmentsPage:
      type: object
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }

    AttachmentVersionEntry:
      type: object
      required: [version, kind, uploaded_by, created_at]
      additionalProperties: false
      properties:
        version: { type: integer }
        kind: { type: string, enum: [upload, path] }
        file_name: { type: string }
        file_size: { type: integer }
        media_type: { type: string }
        checksum: { type: string }
        path_value: { type: string }
        uploaded_by: { type: string, example: "human:alice" }
        created_at: { type: string, format: date-time }

    AttachmentVersionsPage:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/AttachmentVersionEntry' }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            correlation_id: { type: string }
            current_version: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [actor, csrf_token]
      additionalProperties: false
      properties:
        actor: { type: string, example: 'human:alice' }
        csrf_token: { type: string }

    MeResponse:
      type: object
      required: [permission, is_admin]
      additionalProperties: false
      properties:
        actor:
          type: string
          example: 'human:alice'
          description: Absent for an anonymous caller.
        permission:
          type: string
          enum: [viewer, editor]
        is_admin:
          type: boolean
        csrf_token:
          type: string
          description: >
            Present only for a session-authenticated caller (never for
            bearer or anonymous), so a page reload with a still-valid
            session cookie can recover the token requireEditor's
            X-CSRF-Token check needs without forcing a fresh login.
            This response is sent with Cache-Control: no-store.

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    SetupResponse:
      type: object
      required: [actor]
      additionalProperties: false
      properties:
        actor: { type: string, example: 'human:alice' }

    CreateAccountRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        is_admin: { type: boolean, default: false }

    AccountDetail:
      type: object
      required: [username, is_admin]
      additionalProperties: false
      properties:
        username: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }

    AccountsPage:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountDetail' }

    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        old_password:
          type: string
          description: Required and verified for a human changing their own password; ignored for an admin resetting a different account's.
        new_password: { type: string }

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    AgentDetail:
      type: object
      required: [name, description, created_at]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        owner:
          type: string
          example: 'human:alice'
        created_at: { type: string, format: date-time }

    AgentsPage:
      type: object
      properties:
        agents:
          type: array
          items: { $ref: '#/components/schemas/AgentDetail' }

    CreateAgentTokenRequest:
      type: object
      properties:
        description: { type: string }
        expires_at:
          type: string
          format: date-time
          description: Omit for a token with no expiry (product spec §10).

    AgentTokenCreated:
      type: object
      required: [id, token, description]
      additionalProperties: false
      description: >
        The only response shape that ever carries a raw token value
        (ADR 0004: shown once, at creation).
      properties:
        id: { type: integer }
        token: { type: string }
        description: { type: string }
        expires_at: { type: string, format: date-time }

    AgentTokenSummary:
      type: object
      required: [id, description, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    AgentTokensPage:
      type: object
      properties:
        tokens:
          type: array
          items: { $ref: '#/components/schemas/AgentTokenSummary' }

    RestorePendingStatus:
      type: object
      required: [pending, failed]
      additionalProperties: false
      properties:
        pending: { type: boolean }
        failed: { type: boolean }
        last_error: { type: string }

    RestoreStagedResponse:
      type: object
      required: [staged]
      additionalProperties: false
      properties:
        staged: { type: boolean }

    GCRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean }

    IntegrityForeignKeyViolation:
      type: object
      properties:
        table: { type: string }
        row_id: { type: integer, nullable: true }
        parent_table: { type: string }

    IntegrityCorruptedBlob:
      type: object
      properties:
        hash: { type: string }
        error: { type: string }

    IntegrityReport:
      type: object
      required: [database_ok, foreign_key_violations, corrupted_blobs, orphaned_blobs]
      properties:
        database_ok: { type: boolean }
        database_messages:
          type: array
          items: { type: string }
        foreign_key_violations:
          type: array
          items: { $ref: '#/components/schemas/IntegrityForeignKeyViolation' }
        corrupted_blobs:
          type: array
          items: { $ref: '#/components/schemas/IntegrityCorruptedBlob' }
        orphaned_blobs:
          type: array
          items: { type: string }
        removed_blobs:
          type: array
          items: { type: string }
        remove_errors:
          type: array
          items: { type: string }

    ImportReport:
      type: object
      required: [committed, counts, problems]
      properties:
        committed: { type: boolean }
        counts:
          type: object
          additionalProperties: { type: integer }
        problems:
          type: array
          items: { type: string }
