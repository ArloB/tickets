      summary: Get a plan by its public reference (e.g. ABC-P1)
      parameters:
        - $ref: '#/components/parameters/PlanRef'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePlan
      summary: >
        Replace a plan's title and representation-specific content
        (optimistic concurrency) — a full-representation update, the
        same contract as PATCH /decisions/{ref}. Representation itself
        is immutable and not accepted here; multipart replaces a file
        representation's bytes, JSON replaces body/path/url.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentItemRequest'
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title: { type: string }
                media_type: { type: string }
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — see error.current_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/Error'

