  /refs/resolve:
    get:
      operationId: resolveRefs
      summary: >
        Resolve a batch of reference tokens to whether each names a
        live record, and — when it does — its kind, title, and status.
        The existence check behind rendering references embedded in
        Markdown prose as hyperlinks (ADR 0025): a renderer scans a
        body for docs/contracts/references.md tokens and asks here
        which of them to turn into links. Best-effort in the same way
        the scan itself is — a malformed token, an unknown kind
        letter, a well-formed token naming nothing, and a soft-deleted
        record all come back as exists=false rather than an error.
        Accepts a bare project key ("ABC") alongside the five
        seq-numbered kinds; does not accept the project-scoped short
        form ("#123"), which has meaning only relative to the body
        being rendered, so a caller expands it against its own project
        scope first. Tokens are deduplicated in first-occurrence
        order, so a raw scan can be passed unfiltered.
      parameters:
        - name: refs
          in: query
          description: >
            Comma-separated reference tokens, at most 50 per request.
            Omitted or empty returns an empty list.
          schema:
            type: string
            example: ABC-1,ABC-F2,ABC-P3,ABC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedRefPage'
        '400':
          $ref: '#/components/responses/Error'

  /search:
    get:
      operationId: search
      summary: >
        Unified full-text search (product spec §5.12/§6.3) over
        projects, tickets, features, decisions, plans, documents,
        comments, attachment names, and external link titles/URLs,
        ranked by relevance. q is required; project/kind/status narrow
        an otherwise cross-project search. Pagination is offset-based
        (not the (created_at, id) cursor most list endpoints use) and
        capped at 500 results — see ADR 0018. Unlike GET /projects,
        search is not filtered by project status (ADR 0021): an
        archived project and its still-writable tickets remain equally
        findable, so hiding the project's own row while surfacing its
        tickets would be the inconsistent outcome.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: Restrict to one project's key; omitted searches every project.
          schema:
            type: string
        - name: kind
          in: query
          description: >
            Comma-separated kinds to filter to: project, ticket,
            feature, decision, plan, document, comment, attachment,
            link.
          schema:
            type: string
            example: ticket,comment
        - name: status
          in: query
          description: >
            A single status value (workflow status for tickets/
            features, decision status for decisions); plans/documents/
            comments have no status, so this never matches them.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /events:
    get:
      operationId: streamEvents
      summary: >
        Server-Sent Events stream of change hints (product spec §6.4,
        ADR 0020). Every event is an invalidation signal only — "ref"/
        "project" (entity_changed) or nothing (notifications_changed,
        delivered only to the connection's own authenticated actor) —
        never the changed value itself; a client refetches through the
        normal REST endpoints on receipt. Reachable anonymously when
        anonymous read is enabled, like any other GET, but an
        anonymous connection only ever receives entity_changed events.
        Not response-schema-validated the way other endpoints are: an
        indefinite text/event-stream body has no fixed JSON shape for
        OpenAPI's response schema to describe.
      responses:
        '200':
          description: >
            An open text/event-stream connection. Each event's "event:"
            field is entity_changed or notifications_changed; "data:"
            is a small JSON object ({"ref", "project"} or {"actor"}).
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'

