openapi: 3.0.3
info:
  title: Tickets API
  version: 0.1.0
  license:
    name: UNLICENSED
  description: >
    Versioned HTTP API for Tickets. Covers the full MVP surface:
    project/feature/ticket CRUD, comments, typed relationships and
    associations, decisions/plans/documents with version history,
    attachments, full-text search, subscriptions and notifications,
    SSE change hints, health endpoints, and the identity surface
    (session login/logout, the caller's own resolved principal, and
    admin agent/token management) — see docs/contracts/ and the
    implementation plan.
servers:
  - url: /api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /projects:
    post:
      operationId: createProject
      summary: Create a project (and its mandatory General feature)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      summary: List projects (cursor-paginated, ordered by created_at then id)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: include_archived
          in: query
          description: >
            When true, also return archived projects (ADR 0021).
            Default false: archived projects are excluded, matching
            the default search behavior's opposite choice — see
            Search's kind parameter description for why the two
            differ.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsPage'
        '400':
          $ref: '#/components/responses/Error'

  /projects/{key}:
    get:
      operationId: getProject
      summary: Get a project by key
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProject
      summary: Update a project's title/description (optimistic concurrency). See POST .../status for archive/unarchive.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /projects/{key}/status:
    post:
      operationId: updateProjectStatus
      summary: >
        Archive or unarchive a project (optimistic concurrency, ADR
        0021). Archiving is visibility only: the project drops out of
        the default GET /projects and search results, but its
        tickets, features, and knowledge records stay fully readable
        and writable. Mirrors POST /features/{ref}/status's
        status-only contract.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — see error.current_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /projects/{key}/brief:
    get:
      operationId: getProjectBrief
      summary: >
        A project's orientation read (product spec §12, Phase 6 Step
        5): in-progress/upcoming tickets, issue-register highlights,
        the feature list with ticket-progress counts, recent activity,
        and recent accepted decisions and plans, each capped at 20
        compact rows. The recommended first call when getting oriented
        in a project, before any detail call narrows in on one record.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBrief'
        '404':
          $ref: '#/components/responses/Error'

  /projects/{key}/tickets:
    post:
      operationId: createTicket
      summary: >
        Create a ticket in a project. Always lands in the project's
        General feature (product spec §6.1) — explicit feature
        selection is Phase 1 work.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: listTickets
      summary: >
        List a project's tickets (product spec §5.6). Priority-queue
        order by default; ?view=issue_register switches to the
        severity-ordered bug/security-only view (§5.5). The backlog
        view (§6.1) is this same default ordering with filters layered
        on — there is no separate ?view= value for it. Every filter
        parameter is optional and AND-composed with the others
        (docs/contracts/list-filters.md); none encode into ?cursor=, so
        a caller paginating a filtered listing must resupply the same
        filters on every page.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: view
          in: query
          schema:
            type: string
            enum: [priority_queue, issue_register]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: fields
          in: query
          description: Comma-separated list of fields to narrow each list item to (docs/contracts/representations.md).
          schema:
            type: string
        - $ref: '#/components/parameters/FilterStatus'
        - name: type
          in: query
          description: Narrow to one ticket type. AND-composed; absent = any.
          schema:
            type: string
            enum: [task, bug, security, chore]
        - name: severity
          in: query
          description: Narrow to one severity. AND-composed; absent = any.
          schema:
            type: string
            enum: [critical, high, medium, low]
        - $ref: '#/components/parameters/FilterPriority'
        - name: feature_ref
          in: query
          description: Narrow to tickets in one feature, e.g. "ABC-F1". AND-composed; absent = any.
          schema:
            type: string
        - name: assignee
          in: query
          description: >
            Narrow to one assignee, as an actor reference wire form
            (e.g. "human:alice"). AND-composed; absent = any.
          schema:
            type: string
        - $ref: '#/components/parameters/FilterCreator'
        - $ref: '#/components/parameters/FilterUpdatedSince'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketsPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /tickets/{ref}:
    get:
      operationId: getTicket
      summary: Get a ticket by its public reference (e.g. ABC-123)
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - name: include_deleted
          in: query
          description: Return the ticket even when it is soft-deleted.
          schema: { type: boolean, default: false }
        - name: include
          in: query
          description: Comma-separated sub-resources to expand (comments, relationships).
          schema:
            type: string
        - name: fields
          in: query
          description: >
            Comma-separated list of fields to narrow the response to
            (docs/contracts/representations.md). When present, the
            response is a subset object containing only the named
            fields, not the full Ticket shape this operation's 200
            schema documents — OpenAPI 3.0 has no way to express a
            response shape conditioned on a query parameter's value,
            the same limitation CSRFToken's conditional requirement
            already documents this way.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTicketStatus
      summary: Update a ticket's workflow status (optimistic concurrency)
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — see error.current_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateTicketFields
      summary: >
        Replace a ticket's type/title/description/priority/severity
        (optimistic concurrency). A distinct route from the status-only
        PATCH above — see updateTicketFields' doc comment
        (internal/httpapi/tickets.go) for why they aren't merged.
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketFieldsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTicket
      summary: Soft-delete a ticket (ADR 0013). A ticket has no dependents check.
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: OK. The response's version is the ticket's new version, for a subsequent restore's If-Match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /tickets/{ref}/assign:
    post:
      operationId: assignTicket
      summary: Set or clear a ticket's assignee (optimistic concurrency)
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /tickets/{ref}/move:
    post:
      operationId: moveTicket
      summary: Move a ticket to a different feature in the same project (optimistic concurrency)
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /tickets/{ref}/reorder:
    post:
      operationId: reorderTicket
      summary: Move a ticket to a new position within its priority group
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /tickets/{ref}/restore:
    post:
      operationId: restoreTicket
      summary: Clear a ticket's soft-delete. Refuses if the ticket's feature is itself deleted.
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /projects/{key}/features:
    post:
      operationId: createFeature
      summary: Create a feature in a project
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listFeatures
      summary: >
        List a project's non-deleted features, cursor-paginated,
        ordered by priority then position. Every filter parameter is
        optional and AND-composed with the others
        (docs/contracts/list-filters.md); none encode into ?cursor=.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/FilterStatus'
        - $ref: '#/components/parameters/FilterPriority'
        - $ref: '#/components/parameters/FilterCreator'
        - $ref: '#/components/parameters/FilterUpdatedSince'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturesPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /features/{ref}:
    get:
      operationId: getFeature
      summary: Get a feature by its public reference (e.g. ABC-F1)
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - name: include_deleted
          in: query
          description: Return the feature even when it is soft-deleted.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateFeature
      summary: Update a feature's title/description/priority (optimistic concurrency)
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteFeature
      summary: >
        Soft-delete a feature. Blocked by 409 has_dependents if it
        holds non-deleted tickets, unless cascade=true deletes them
        together (ADR 0013). The General feature can never be deleted.
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
        - name: cascade
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK. The response's version is the feature's new version, for a subsequent restore's If-Match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /features/{ref}/status:
    post:
      operationId: updateFeatureStatus
      summary: >
        Update a feature's workflow status (optimistic concurrency).
        Phase 4 addition mirroring PATCH /tickets/{ref}'s status-only
        contract — features previously had no way to change status
        after creation.
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — see error.current_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /features/{ref}/reorder:
    post:
      operationId: reorderFeature
      summary: Move a feature to a new position within its priority group
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /features/{ref}/restore:
    post:
      operationId: restoreFeature
      summary: Clear a feature's soft-delete. Does not restore any tickets a cascade delete took down with it.
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /tickets/{ref}/comments:
    post:
      operationId: createComment
      summary: Add a comment to a ticket
      parameters:
        - $ref: '#/components/parameters/TicketRef'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listComments
      summary: List every comment on a ticket, oldest first, tombstones included
      parameters:
        - $ref: '#/components/parameters/TicketRef'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsPage'
        '404':
          $ref: '#/components/responses/Error'

  /features/{ref}/comments:
    post:
      operationId: createFeatureComment
      summary: Add a comment to a feature
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listFeatureComments
      summary: List every comment on a feature, oldest first, tombstones included
      parameters:
        - $ref: '#/components/parameters/FeatureRef'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsPage'
        '404':
          $ref: '#/components/responses/Error'

  /decisions/{ref}/comments:
    post:
      operationId: createDecisionComment
      summary: Add a comment to a decision
      parameters:
        - $ref: '#/components/parameters/DecisionRef'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
