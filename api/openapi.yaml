              schema:
                type: object
                properties:
                  status: { type: string }
        '403':
          $ref: '#/components/responses/Error'

components:
  parameters:
    ProjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9]{1,9}$'
    TicketRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-123
    FeatureRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-F1
    DecisionRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        example: ABC-D1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        A double-quoted decimal version number, e.g. "3" (see
        docs/contracts/concurrency.md — not full RFC 7232 ETag
        semantics).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >
        Required when authenticated via the tickets_session cookie
        (product spec §10); not required for bearer-token requests,
        which aren't subject to browser CSRF. Documented as optional
        here because whether it's actually required depends on which
        credential the request uses, which OpenAPI 3.0 can't express
        conditionally.
      schema:
        type: string
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
    FilterStatus:
      name: status
      in: query
      description: >
        Narrow to one workflow status (docs/contracts/list-filters.md).
        AND-composed with every other filter present; absent = any.
      schema:
        type: string
        enum: [backlog, ready, in_progress, blocked, review, done, cancelled]
    FilterPriority:
      name: priority
      in: query
      description: Narrow to one priority. AND-composed; absent = any.
      schema:
        type: string
        enum: [critical, high, medium, low]
    FilterCreator:
      name: creator
      in: query
      description: >
        Narrow to one creator, as an actor reference wire form (e.g.
        "human:alice"). AND-composed; absent = any.
      schema:
        type: string
    FilterUpdatedSince:
      name: updated_since
      in: query
      description: >
        Narrow to records updated at or after this RFC3339 timestamp.
        AND-composed; absent = any.
      schema:
        type: string
        format: date-time
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    RelationshipType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RelationshipType'
    TargetRef:
      name: target
      in: path
      required: true
      description: A ticket or feature reference (e.g. ABC-123 or ABC-F1).
      schema:
        type: string
    LinkID:
      name: id
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tickets_session
      description: >
        Human session cookie, set by POST /auth/login (ADR 0004).
        Mutating requests using it must also carry X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Agent bearer token, issued once by POST
        /agents/{name}/tokens and never shown again (ADR 0004).

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ProjectStatus:
      type: string
      enum: [active, archived]
    TicketType:
      type: string
      enum: [task, bug, security, chore]
    WorkflowStatus:
      type: string
      enum: [backlog, ready, in_progress, blocked, review, done, cancelled]
    Priority:
      type: string
      enum: [critical, high, medium, low]
    Severity:
      type: string
      enum: [critical, high, medium, low]
    DecisionStatus:
      type: string
      enum: [proposed, accepted, rejected, superseded]

    CreateProjectRequest:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        title:
          type: string
        description:
          type: string

    Project:
      type: object
      required: [key, title, description, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCompact:
      type: object
      required: [key, title, status, version, updated_at]
      additionalProperties: false
      description: >
        The list-item shape GET /projects returns (docs/contracts/
        representations.md's compact/detail split). No description, no
        created_at — small enough that a full page stays well under
        agent context budgets (product spec §7.2).
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ProjectsPage:
      type: object
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectCompact' }
        next_cursor:
          type: string

    CreateTicketRequest:
      type: object
      required: [type, title]
      properties:
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }

    UpdateTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkflowStatus' }

    UpdateTicketFieldsRequest:
      type: object
      required: [type, title, priority]
      properties:
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }

    AssignTicketRequest:
      type: object
      properties:
        assignee:
          type: string
          nullable: true
          example: 'human:alice'
          description: Null clears the assignment.

    MoveTicketRequest:
      type: object
      required: [feature]
      properties:
        feature:
          type: string
          example: ABC-F2

    Ticket:
      type: object
      required: [ref, project, feature, type, title, description, status, priority, version, created_at, updated_at]
      additionalProperties: false
      properties:
        ref: { type: string, example: ABC-123 }
        project: { type: string }
        feature: { type: string, example: ABC-F1 }
        type: { $ref: '#/components/schemas/TicketType' }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }
        assignee:
          type: string
          example: 'human:alice'
          description: Absent when unassigned.
        creator:
          type: string
          example: 'human:alice'
          description: >
            Absent only for entities created before Phase 2's identity
            work (ADR 0012); always present for anything created since.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
          description: Present only when requested via ?include=comments.
        relationships:
          type: array
          items: { $ref: '#/components/schemas/RelationshipView' }
          description: Present only when requested via ?include=relationships.

    TicketCompact:
      type: object
      required: [ref, title, type, status, priority, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/tickets' list-item shape
        (docs/contracts/representations.md) — no description or body,
        same compact/detail split as FeatureCompact/ProjectCompact.
      properties:
        ref: { type: string, example: ABC-123 }
        title: { type: string }
        type: { $ref: '#/components/schemas/TicketType' }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Severity' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    TicketsPage:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: '#/components/schemas/TicketCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    CreateFeatureRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }

    UpdateFeatureRequest:
      type: object
      required: [title, priority]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }

    Feature:
      type: object
      required: [ref, project, title, description, status, priority, version, created_at, updated_at]
      additionalProperties: false
      properties:
        ref: { type: string, example: ABC-F1 }
        project: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FeatureCompact:
      type: object
      required: [ref, title, status, priority, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/features' list-item shape. No description —
        same compact/detail split as ProjectCompact.
      properties:
        ref: { type: string, example: ABC-F1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    FeaturesPage:
      type: object
      properties:
        features:
          type: array
          items: { $ref: '#/components/schemas/FeatureCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    CreateDecisionRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }

    UpdateDecisionRequest:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }

    Decision:
      type: object
      required: [ref, project, title, context, decision, rationale, status, version, created_at, updated_at]
      additionalProperties: false
      description: >
        Phase 3's minimal decisions slice (product spec §5.8) — no
        versioning/diff/supersession fields yet; those are Phase 5's
        extension of this same record.
      properties:
        ref: { type: string, example: ABC-D1 }
        project: { type: string }
        title: { type: string }
        context: { type: string }
        decision: { type: string }
        rationale: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DecisionCompact:
      type: object
      required: [ref, title, status, version, updated_at]
      additionalProperties: false
      description: >
        GET /projects/{key}/decisions' list-item shape. No context/
        decision/rationale — same compact/detail split as FeatureCompact.
      properties:
        ref: { type: string, example: ABC-D1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    DecisionsPage:
      type: object
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/DecisionCompact' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    ActivityEventType:
      type: string
      description: >
        The "selected" audit event types the activity feed shows
        (product spec §5.10) — internal/service/activity.go's
        activityEventTypes allowlist is this enum's single source of
        truth; keep the two in lockstep.
      enum:
        - project_created
        - ticket_created
        - ticket_status_changed
        - relationship_added
        - relationship_removed
        - feature_created
        - feature_updated
        - feature_status_changed
        - ticket_updated
        - ticket_assigned
        - ticket_moved
        - comment_added
        - comment_edited
        - comment_deleted
        - ticket_reordered
        - feature_reordered
        - ticket_deleted
        - ticket_restored
        - feature_deleted
        - feature_restored
        - association_added
        - association_removed
        - decision_created
        - decision_updated
        - external_link_added
        - external_link_removed

    ActivityEvent:
      type: object
      required: [id, entity_kind, actor, event_type, created_at]
      additionalProperties: false
      description: >
        One row of a project's activity feed (§5.10): comments merged
        with selected audit events, newest first. `entity` is absent
        only for a project-level event (project_created/
        project_updated) — a project has no seq-numbered reference
        token (see the Decision schema's sibling reasoning).
      properties:
        id: { type: integer }
        entity: { type: string, example: ABC-123 }
        entity_kind:
          type: string
          enum: [project, ticket, feature, decision, plan, document]
        actor: { type: string, example: 'human:alice' }
        event_type: { $ref: '#/components/schemas/ActivityEventType' }
        comment_id: { type: integer }
        comment_excerpt:
          type: string
          description: >
            The first 200 characters of the comment's live body, present
            only when comment_id is set.
        created_at: { type: string, format: date-time }

    ActivityPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        next_cursor:
          type: string
          description: Opaque pagination cursor. Absent on the last page.

    ReorderRequest:
      type: object
      properties:
        after_ref:
          type: string
          nullable: true
          description: >
            Place immediately after this reference, which must be in
            the same priority group. Omit or null to move to the head
            of the group.

    AddCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }

    Comment:
      type: object
      required: [id, author, body, version, created_at, updated_at]
      additionalProperties: false
      description: >
        Unlike Ticket/Feature, this schema's id is a bare integer and
        is the comment's actual public identity (ADR 0002's exception
        — a comment has no formatted reference or UUID for a surrogate
        to hide behind; see internal/httpapi/wire_test.go's
        schemasWhereIDIsThePublicIdentity). deleted_at is also exposed
        deliberately here, unlike Ticket/Feature: §5.10's tombstone is
        meant to reach the wire — body stays intact, and a client
        checks deleted_at to render a tombstone instead of the content.
      properties:
        id: { type: integer }
        author: { type: string, example: 'human:alice' }
        body: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }

    CommentsPage:
      type: object
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    CommentHistoryEntry:
      type: object
      required: [version, body, edited_by, created_at]
      additionalProperties: false
      properties:
        version: { type: integer }
        body: { type: string }
        edited_by: { type: string, example: 'human:alice' }
        created_at: { type: string, format: date-time }

    CommentHistoryPage:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/CommentHistoryEntry' }

    RelationshipType:
      type: string
      enum: [parent_of, child_of, blocks, blocked_by, related_to, duplicate_of, supersedes, superseded_by]

    AddRelationshipRequest:
      type: object
      required: [target, type]
      properties:
        target: { type: string, example: ABC-124 }
        type: { $ref: '#/components/schemas/RelationshipType' }

    RelationshipView:
      type: object
      required: [type, other]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/RelationshipType' }
        other: { type: string, example: ABC-124 }

    RelationshipsPage:
      type: object
      properties:
        relationships:
          type: array
          items: { $ref: '#/components/schemas/RelationshipView' }

    AddAssociationRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: A ticket or feature reference (e.g. ABC-123 or ABC-F1).
          example: ABC-F2

    AssociationsPage:
      type: object
      properties:
        associated:
          type: array
          items: { type: string }

    AddLinkRequest:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url:
          type: string
          description: >
            Must use http, https, or mailto — an allow-listed scheme,
            checked server-side (internal/domain.ValidateLinkURL),
            since a stored javascript:/data: URL rendered as a
            clickable link would be a stored-XSS vector.
          example: https://example.com/design-doc

    ExternalLink:
      type: object
      required: [id, title, url]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }

    ExternalLinksPage:
      type: object
      properties:
        links:
          type: array
          items: { $ref: '#/components/schemas/ExternalLink' }

    Backlink:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: The reference of the entity that mentions this record.
          example: ABC-124
        comment_id:
          type: integer
          description: >
            Present only when the mention came from a comment on ref
            rather than ref's own Markdown body.

    BacklinksPage:
      type: object
      properties:
        backlinks:
          type: array
          items: { $ref: '#/components/schemas/Backlink' }

    DeleteResponse:
      type: object
      required: [version]
      additionalProperties: false
      description: >
        The soft-deleted entity's new version (ADR 0013) — enough for
        a caller to construct a subsequent restore call's If-Match
        without a second read.
      properties:
        version: { type: integer }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            correlation_id: { type: string }
            current_version: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [actor, csrf_token]
      additionalProperties: false
      properties:
        actor: { type: string, example: 'human:alice' }
        csrf_token: { type: string }

    MeResponse:
      type: object
      required: [permission, is_admin]
      additionalProperties: false
      properties:
        actor:
          type: string
          example: 'human:alice'
          description: Absent for an anonymous caller.
        permission:
          type: string
          enum: [viewer, editor]
        is_admin:
          type: boolean
        csrf_token:
          type: string
          description: >
            Present only for a session-authenticated caller (never for
            bearer or anonymous), so a page reload with a still-valid
            session cookie can recover the token requireEditor's
            X-CSRF-Token check needs without forcing a fresh login.
            This response is sent with Cache-Control: no-store.

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    SetupResponse:
      type: object
      required: [actor]
      additionalProperties: false
      properties:
        actor: { type: string, example: 'human:alice' }

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    AgentDetail:
      type: object
      required: [name, description, created_at]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        owner:
          type: string
          example: 'human:alice'
        created_at: { type: string, format: date-time }

    AgentsPage:
      type: object
      properties:
        agents:
          type: array
          items: { $ref: '#/components/schemas/AgentDetail' }

    CreateAgentTokenRequest:
      type: object
      properties:
        description: { type: string }
        expires_at:
          type: string
          format: date-time
          description: Omit for a token with no expiry (product spec §10).

    AgentTokenCreated:
      type: object
      required: [id, token, description]
      additionalProperties: false
      description: >
        The only response shape that ever carries a raw token value
        (ADR 0004: shown once, at creation).
      properties:
        id: { type: integer }
        token: { type: string }
        description: { type: string }
        expires_at: { type: string, format: date-time }

    AgentTokenSummary:
      type: object
      required: [id, description, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    AgentTokensPage:
      type: object
      properties:
        tokens:
          type: array
          items: { $ref: '#/components/schemas/AgentTokenSummary' }
