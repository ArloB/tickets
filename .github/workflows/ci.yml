# Dormant until a GitHub remote exists (Phase 0 decision: local git + WSL
# only, no remote yet). Kept in sync with Taskfile.yml so local and CI can
# never drift — every step here just calls the same tasks a developer runs
# locally, including lint (previously this ran golangci-lint-action's own
# built-in `run` step instead of `task lint`, which was exactly the kind
# of drift this comment claims doesn't happen — fixed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: fmt
        run: task fmt

      - name: lint
        run: task lint

      - name: test (with race detector on Linux)
        if: runner.os == 'Linux'
        run: task test:race

      - name: test
        if: runner.os != 'Linux'
        run: task test

      - name: openapi lint
        run: task openapi

      - name: build
        run: task build
