name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: fmt
        run: task fmt

      - name: lint
        run: task lint

      - name: test (with race detector on Linux)
        if: runner.os == 'Linux'
        run: task test:race

      - name: test
        if: runner.os != 'Linux'
        run: task test

      - name: openapi lint
        run: task openapi

      - name: web lint
        run: task web:lint

      - name: web test
        run: task web:test

      - name: build
        run: task build
